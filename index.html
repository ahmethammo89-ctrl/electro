<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة اشتراكات الكهرباء</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#10151C;
    --panel:#1A222D;
    --panel-2:#212B38;
    --border:#2A3542;
    --text:#EDEFF3;
    --muted:#8D96A6;
    --accent:#E3A73E;
    --accent-dark:#B9821F;
    --teal:#4FA6A8;
    --success:#4FAE79;
    --danger:#DD6459;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Tajawal',sans-serif;}
  body{min-height:100vh;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:76px;}
  h1,h2,h3{font-weight:700;margin:0;}
  p{margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input,select{font-family:inherit;}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;gap:8px;}
  .brand-mark{width:56px;height:56px;border-radius:14px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:12px;color:#241A05;font-weight:700;}
  .muted{color:var(--muted);font-size:14px;line-height:1.6;}
  .role-list{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:24px;}
  .role-btn{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:right;color:var(--text);font-size:15px;font-weight:500;display:flex;align-items:center;justify-content:space-between;transition:border-color .15s;}
  .role-btn:hover{border-color:var(--accent);}
  .role-btn span.icon{font-size:20px;}
  .top-bar{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;z-index:5;}
  .top-bar h2{font-size:17px;}
  .top-bar .role-tag{font-size:12px;color:var(--accent);background:rgba(227,167,62,.12);padding:3px 10px;border-radius:20px;margin-top:2px;display:inline-block;}
  .logout-btn{background:transparent;color:var(--muted);font-size:13px;border:1px solid var(--border);padding:7px 12px;border-radius:8px;}
  .content{flex:1;padding:18px 20px 32px;}
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
  .field label{font-size:13px;color:var(--muted);}
  .field input,.field select{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:11px 12px;color:var(--text);font-size:15px;width:100%;}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .btn-primary{background:var(--accent);color:#241A05;font-weight:700;padding:13px 18px;border-radius:9px;font-size:15px;width:100%;}
  .btn-primary:disabled{opacity:.5;}
  .btn-secondary{background:var(--panel-2);color:var(--text);border:1px solid var(--border);padding:11px 16px;border-radius:9px;font-size:14px;}
  .btn-ghost{background:transparent;color:var(--accent);font-size:13px;padding:6px 4px;}
  .btn-danger-text{background:transparent;color:var(--danger);font-size:13px;padding:6px 4px;}
  .error-text{color:var(--danger);font-size:13px;margin-top:2px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
  .stat-card{background:var(--panel);border-radius:var(--radius);padding:14px;}
  .stat-card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .stat-card .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;}
  .stat-card.wide{grid-column:1 / -1;}
  .section-title{font-size:14px;color:var(--muted);margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;}
  .list-row{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--border);}
  .list-row:last-child{border-bottom:none;}
  .list-row .rname{font-size:15px;font-weight:500;}
  .list-row .rsub{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .list-row .ramount{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;}
  .pill{font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:500;}
  .pill.paid{background:rgba(79,174,121,.15);color:var(--success);}
  .pill.unpaid{background:rgba(221,100,89,.15);color:var(--danger);}
  .empty-state{text-align:center;padding:40px 16px;color:var(--muted);font-size:14px;}
  .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);display:flex;max-width:520px;margin:0 auto;z-index:10;}
  .bottom-nav button{flex:1;background:none;color:var(--muted);padding:12px 4px 10px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .bottom-nav button .dot{width:5px;height:5px;border-radius:50%;background:transparent;}
  .bottom-nav button.active{color:var(--accent);}
  .bottom-nav button.active .dot{background:var(--accent);}
  .month-picker{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .month-picker input{flex:1;}
  .reading-card{background:var(--panel);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
  .reading-card .rc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .reading-card .rc-name{font-size:15px;font-weight:500;}
  .reading-card .rc-tier{font-size:12px;color:var(--muted);}
  .rc-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;}
  .rc-inputs .field{margin-bottom:0;}
  .rc-summary{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px;}
  .rc-summary b{color:var(--text);font-variant-numeric:tabular-nums;}
  .rc-actions{display:flex;gap:8px;}
  .rc-actions button{flex:1;padding:9px;border-radius:8px;font-size:13px;font-weight:500;}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:50;}
  .modal-sheet{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:16px 16px 0 0;padding:20px;max-height:88vh;overflow-y:auto;border-top:1px solid var(--border);}
  .modal-sheet h3{margin-bottom:16px;font-size:16px;}
  .close-x{position:absolute;left:16px;top:16px;background:var(--panel-2);width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:16px;}
  .tier-row{background:var(--panel);border-radius:var(--radius);padding:13px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
  .tier-row .tname{font-size:15px;font-weight:500;}
  .tier-row .tprice{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .add-fab{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--accent);color:#241A05;width:52px;height:52px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;max-width:520px;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:8;}
  .loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;}
  .profile-card{background:var(--panel);border-radius:var(--radius);padding:18px;margin-bottom:20px;}
  .profile-card .pname{font-size:18px;font-weight:700;margin-bottom:4px;}
  .profile-card .pmeta{font-size:13px;color:var(--muted);}
  .link-inline{background:none;color:var(--accent);font-size:14px;text-decoration:underline;}
  .print-btn{background:transparent;color:var(--teal);border:1px solid var(--border);font-size:12.5px;padding:6px 10px;border-radius:8px;}
  #print-area{display:none;}
  @media print{
    body *{visibility:hidden;}
    #print-area, #print-area *{visibility:visible;}
    #print-area{display:block;position:absolute;top:0;left:0;width:80mm;padding:4mm;font-family:'Tajawal',sans-serif;color:#000;}
    #print-area .pr-title{font-size:14px;font-weight:700;text-align:center;margin-bottom:6px;}
    #print-area .pr-line{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #000;}
    #print-area .pr-total{font-size:14px;font-weight:700;display:flex;justify-content:space-between;padding-top:8px;}
    #print-area .pr-foot{text-align:center;font-size:10.5px;margin-top:10px;color:#333;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="print-area"></div>
<script>
// حط هون الـ Project URL و anon key يلي جبتهم من Settings > API بمشروع Supabase
const SUPABASE_URL = 'https://omdliavluxjipsdhdhim.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9tZGxpYXZsdXhqaXBzZGhkaGltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyMzk0MDMsImV4cCI6MjEwMzgxNTQwM30.2ePY8lpL7CBZ1hEWV_RJhQ3eK0ZTPF1PkZ424WiMPD4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const state = {
  loaded:false,
  view:'landing',
  role:null,
  currentSubscriberId:null,
  adminTab:'dashboard',
  currentMonth:new Date().toISOString().slice(0,7),
  config:{currency:'$'},
  tiers:[],
  subscribers:[],
  bills:[],
  formType:null,
  formData:null,
  loginPhone:'',
  loginError:''
};

function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function normPhone(p){return (p||'').replace(/[^0-9]/g,'');}
function money(n){const v=Math.round((n||0)*100)/100;return state.config.currency+' '+v.toLocaleString('en-US');}
function num(n){return Math.round((n||0)*100)/100;}

function fromRow(b){
  return {id:b.id, subscriberId:b.subscriber_id, month:b.month, oldReading:Number(b.old_reading),
    newReading:Number(b.new_reading), consumption:Number(b.consumption), amount:Number(b.amount),
    pricePerKwh:Number(b.price_per_kwh), fixed:Number(b.fixed), paid:b.paid, paidDate:b.paid_date};
}
function subFromRow(s){ return {id:s.id, name:s.name, phone:s.phone, tierId:s.tier_id, address:s.address, createdAt:s.created_at}; }

async function loadAll(){
  try{
    const [{data:cfg}, {data:tiers}, {data:subs}, {data:bills}] = await Promise.all([
      sb.from('config').select('*').eq('id',1).maybeSingle(),
      sb.from('tiers').select('*').order('created_at'),
      sb.from('subscribers').select('*').order('name'),
      sb.from('bills').select('*')
    ]);
    if(cfg) state.config = {currency: cfg.currency};
    state.tiers = (tiers||[]).map(t=>({id:t.id, ampere:t.ampere, price:Number(t.price), fixed:Number(t.fixed)}));
    state.subscribers = (subs||[]).map(subFromRow);
    state.bills = (bills||[]).map(fromRow);
  }catch(e){ console.error('load error', e); }
  state.loaded = true;
  render();
}

async function saveConfig(){
  try{ await sb.from('config').upsert({id:1, currency: state.config.currency}); }
  catch(e){ console.error('save config failed', e); }
}

function tierById(id){ return state.tiers.find(t=>t.id===id); }
function subscriberById(id){ return state.subscribers.find(s=>s.id===id); }

function billFor(subscriberId, month){
  return state.bills.find(b=>b.subscriberId===subscriberId && b.month===month);
}
function previousReading(subscriberId, beforeMonth){
  const past = state.bills.filter(b=>b.subscriberId===subscriberId && b.month<beforeMonth).sort((a,b)=>a.month<b.month?1:-1);
  return past.length ? past[0].newReading : null;
}

function computeAmount(tier, oldR, newR){
  const consumption = Math.max(0,(newR||0)-(oldR||0));
  const amount = consumption*(tier?tier.price:0) + (tier?(tier.fixed||0):0);
  return {consumption, amount};
}

function setView(v){ state.view=v; render(); }

function logout(){
  state.role=null; state.currentSubscriberId=null; state.view='landing'; state.loginPhone=''; state.loginError='';
  render();
}

function tryLoginSubscriber(){
  const p = normPhone(state.loginPhone);
  if(!p){ state.loginError='لازم تدخل رقم هاتف'; render(); return; }
  const sub = state.subscribers.find(s=>normPhone(s.phone)===p);
  if(!sub){ state.loginError='ما لقينا اشتراك مسجل بهذا الرقم'; render(); return; }
  state.role='subscriber';
  state.currentSubscriberId=sub.id;
  state.loginError='';
  state.view='app';
  render();
}

function enterAs(role){
  state.role=role;
  state.view = role==='subscriber' ? 'subscriber-login' : 'app';
  state.adminTab = role==='rep' ? 'readings' : 'dashboard';
  render();
}

function openForm(type, data){
  state.formType=type;
  state.formData=data || {};
  render();
}
function closeForm(){ state.formType=null; state.formData=null; render(); }

async function submitTierForm(e){
  e.preventDefault();
  const f = e.target;
  const ampere = f.ampere.value.trim();
  const price = parseFloat(f.price.value);
  const fixed = parseFloat(f.fixed.value)||0;
  if(!ampere || isNaN(price) || price<=0){ return; }
  try{
    if(state.formData.id){
      await sb.from('tiers').update({ampere, price, fixed}).eq('id', state.formData.id);
      const t = tierById(state.formData.id);
      t.ampere=ampere; t.price=price; t.fixed=fixed;
    }else{
      const {data, error} = await sb.from('tiers').insert({ampere, price, fixed}).select().single();
      if(error) throw error;
      state.tiers.push({id:data.id, ampere, price, fixed});
    }
  }catch(err){ alert('صار خطأ بالحفظ: '+err.message); return; }
  closeForm();
}
async function deleteTier(id){
  try{ await sb.from('tiers').delete().eq('id', id); }
  catch(err){ alert('صار خطأ بالحذف: '+err.message); return; }
  state.tiers = state.tiers.filter(t=>t.id!==id);
  render();
}

async function submitSubscriberForm(e){
  e.preventDefault();
  const f = e.target;
  const name = f.name.value.trim();
  const phone = f.phone.value.trim();
  const tierId = f.tierId.value;
  const address = f.address.value.trim();
  if(!name || !phone || !tierId){ return; }
  try{
    if(state.formData.id){
      await sb.from('subscribers').update({name, phone, tier_id:tierId, address}).eq('id', state.formData.id);
      const s = subscriberById(state.formData.id);
      s.name=name; s.phone=phone; s.tierId=tierId; s.address=address;
    }else{
      const {data, error} = await sb.from('subscribers').insert({name, phone, tier_id:tierId, address}).select().single();
      if(error) throw error;
      state.subscribers.push(subFromRow(data));
    }
  }catch(err){
    if((err.message||'').includes('duplicate')) alert('في مشترك مسجّل مسبقاً بنفس رقم الهاتف');
    else alert('صار خطأ بالحفظ: '+err.message);
    return;
  }
  closeForm();
}
async function deleteSubscriber(id){
  try{ await sb.from('subscribers').delete().eq('id', id); }
  catch(err){ alert('صار خطأ بالحذف: '+err.message); return; }
  state.subscribers = state.subscribers.filter(s=>s.id!==id);
  state.bills = state.bills.filter(b=>b.subscriberId!==id);
  render();
}

async function saveReadingRow(subscriberId){
  const oldInput = document.getElementById('old_'+subscriberId);
  const newInput = document.getElementById('new_'+subscriberId);
  const oldR = parseFloat(oldInput.value);
  const newR = parseFloat(newInput.value);
  const errEl = document.getElementById('err_'+subscriberId);
  if(isNaN(oldR) || isNaN(newR)){ errEl.textContent='دخّل رقم القراءة القديمة والجديدة'; return; }
  if(newR < oldR){ errEl.textContent='القراءة الجديدة لازم تكون أكبر من القديمة'; return; }
  errEl.textContent='';
  const sub = subscriberById(subscriberId);
  const tier = tierById(sub.tierId);
  const {consumption, amount} = computeAmount(tier, oldR, newR);
  let bill = billFor(subscriberId, state.currentMonth);
  const row = {subscriber_id:subscriberId, month:state.currentMonth, old_reading:oldR, new_reading:newR,
    consumption, amount, price_per_kwh:tier.price, fixed:tier.fixed||0, paid: bill?bill.paid:false, paid_date: bill?bill.paidDate:null};
  try{
    const {data, error} = await sb.from('bills').upsert(row, {onConflict:'subscriber_id,month'}).select().single();
    if(error) throw error;
    if(bill){
      bill.oldReading=oldR; bill.newReading=newR; bill.consumption=consumption; bill.amount=amount; bill.pricePerKwh=tier.price; bill.fixed=tier.fixed||0;
    }else{
      state.bills.push(fromRow(data));
    }
  }catch(err){ errEl.textContent='صار خطأ بالحفظ: '+err.message; return; }
  render();
}

async function togglePaid(billId){
  const b = state.bills.find(x=>x.id===billId);
  if(!b) return;
  const paid = !b.paid;
  const paidDate = paid ? new Date().toISOString().slice(0,10) : null;
  try{ await sb.from('bills').update({paid, paid_date:paidDate}).eq('id', billId); }
  catch(err){ alert('صار خطأ: '+err.message); return; }
  b.paid = paid; b.paidDate = paidDate;
  render();
}

function fmtMonth(m){
  const [y,mo] = m.split('-');
  const names=['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
  return names[parseInt(mo,10)-1]+' '+y;
}

function fmtDate(d){
  if(!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-GB');
}

function printReceipt(billId){
  const b = state.bills.find(x=>x.id===billId);
  if(!b) return;
  const sub = subscriberById(b.subscriberId);
  const t = tierById(sub?sub.tierId:null);
  const area = document.getElementById('print-area');
  area.innerHTML = `
    <div class="pr-title">وصل اشتراك كهرباء</div>
    <div class="pr-title" style="font-size:11px;font-weight:400;">${fmtMonth(b.month)}</div>
    <div class="pr-line"><span>المشترك</span><span>${sub?sub.name:'—'}</span></div>
    <div class="pr-line"><span>رقم الهاتف</span><span>${sub?sub.phone:'—'}</span></div>
    <div class="pr-line"><span>فئة الأمبير</span><span>${t?t.ampere+' أمبير':'—'}</span></div>
    <div class="pr-line"><span>القراءة القديمة</span><span>${b.oldReading}</span></div>
    <div class="pr-line"><span>القراءة الجديدة</span><span>${b.newReading}</span></div>
    <div class="pr-line"><span>الاستهلاك</span><span>${b.consumption} ك.و.س</span></div>
    <div class="pr-line"><span>سعر الكيلوواط</span><span>${money(b.pricePerKwh)}</span></div>
    ${b.fixed?`<div class="pr-line"><span>رسم ثابت</span><span>${money(b.fixed)}</span></div>`:''}
    <div class="pr-total"><span>الإجمالي</span><span>${money(b.amount)}</span></div>
    <div class="pr-line" style="border-bottom:none;margin-top:6px;"><span>الحالة</span><span>${b.paid?'مدفوع بتاريخ '+fmtDate(b.paidDate):'غير مدفوع'}</span></div>
    <div class="pr-foot">تاريخ الطباعة: ${new Date().toLocaleDateString('en-GB')}</div>`;
  window.print();
}

function render(){
  const app = document.getElementById('app');
  if(!state.loaded){ app.innerHTML = '<div class="loading">عم نحمّل البيانات...</div>'; return; }

  if(state.view==='landing'){ app.innerHTML = renderLanding(); attachLandingEvents(); return; }
  if(state.view==='subscriber-login'){ app.innerHTML = renderSubscriberLogin(); attachSubscriberLoginEvents(); return; }

  let html = renderTopBar();
  html += '<div class="content">';
  if(state.role==='subscriber'){
    html += renderSubscriberView();
  } else if(state.role==='admin'){
    if(state.adminTab==='dashboard') html += renderDashboard();
    else if(state.adminTab==='subscribers') html += renderSubscribersTab();
    else if(state.adminTab==='readings') html += renderReadingsTab();
    else if(state.adminTab==='tiers') html += renderTiersTab();
  } else if(state.role==='rep'){
    html += renderReadingsTab();
  }
  html += '</div>';
  if(state.role==='admin') html += renderBottomNav();
  if(state.formType) html += renderFormModal();
  app.innerHTML = html;
  attachContentEvents();
}

function renderLanding(){
  return `
    <div class="center-screen">
      <div class="brand-mark">⚡</div>
      <h1 style="font-size:21px;">إدارة اشتراكات الكهرباء</h1>
      <p class="muted">تسجيل القراءات، احتساب الفواتير تلقائياً، ومتابعة الدفعات</p>
      <div class="role-list">
        <button class="role-btn" id="btn-admin"><span>الإدارة</span><span class="icon">›</span></button>
        <button class="role-btn" id="btn-rep"><span>مندوب قراءات</span><span class="icon">›</span></button>
        <button class="role-btn" id="btn-subscriber"><span>أنا مشترك</span><span class="icon">›</span></button>
      </div>
    </div>`;
}
function attachLandingEvents(){
  document.getElementById('btn-admin').onclick=()=>enterAs('admin');
  document.getElementById('btn-rep').onclick=()=>enterAs('rep');
  document.getElementById('btn-subscriber').onclick=()=>enterAs('subscriber');
}

function renderSubscriberLogin(){
  return `
    <div class="center-screen">
      <div class="brand-mark">⚡</div>
      <h1 style="font-size:19px;">دخول المشترك</h1>
      <p class="muted">دخّل رقم هاتفك المسجّل بالاشتراك</p>
      <div style="width:100%;margin-top:18px;">
        <div class="field">
          <input type="tel" id="phone-input" placeholder="03 123 456" value="${state.loginPhone}">
        </div>
        ${state.loginError?`<p class="error-text" style="margin-bottom:10px;">${state.loginError}</p>`:''}
        <button class="btn-primary" id="login-btn">دخول</button>
        <button class="link-inline" id="back-btn" style="margin-top:14px;">رجوع</button>
      </div>
    </div>`;
}
function attachSubscriberLoginEvents(){
  document.getElementById('login-btn').onclick=tryLoginSubscriber;
  document.getElementById('back-btn').onclick=()=>setView('landing');
  const inp = document.getElementById('phone-input');
  inp.oninput=(e)=>{ state.loginPhone=e.target.value; };
  inp.onkeydown=(e)=>{ if(e.key==='Enter') tryLoginSubscriber(); };
  inp.focus();
}

function renderTopBar(){
  const roleLabel = state.role==='admin'?'الإدارة':state.role==='rep'?'مندوب قراءات':'حساب المشترك';
  return `
    <div class="top-bar">
      <div>
        <h2>إدارة اشتراكات الكهرباء</h2>
        <span class="role-tag">${roleLabel}</span>
      </div>
      <button class="logout-btn" id="logout-btn">خروج</button>
    </div>`;
}

function renderDashboard(){
  const monthBills = state.bills.filter(b=>b.month===state.currentMonth);
  const paidBills = monthBills.filter(b=>b.paid);
  const unpaidBills = monthBills.filter(b=>!b.paid);
  const collected = paidBills.reduce((s,b)=>s+b.amount,0);
  const due = unpaidBills.reduce((s,b)=>s+b.amount,0);
  let html = `
    <div class="month-picker">
      <label class="field" style="flex:1;margin:0;"><input type="month" id="month-input" value="${state.currentMonth}"></label>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="label">عدد المشتركين</div><div class="val">${state.subscribers.length}</div></div>
      <div class="stat-card"><div class="label">فواتير هالشهر</div><div class="val">${monthBills.length}</div></div>
      <div class="stat-card"><div class="label">محصّل</div><div class="val" style="color:var(--success);">${money(collected)}</div></div>
      <div class="stat-card"><div class="label">مستحق</div><div class="val" style="color:var(--danger);">${money(due)}</div></div>
    </div>
    <div class="section-title">غير المدفوعين هالشهر (${unpaidBills.length})</div>`;
  if(!unpaidBills.length){
    html += `<div class="empty-state">${monthBills.length? 'كل المشتركين دافعين لهالشهر' : 'ما في فواتير مسجّلة لهالشهر بعد'}</div>`;
  }else{
    unpaidBills.forEach(b=>{
      const sub = subscriberById(b.subscriberId);
      html += `<div class="list-row">
        <div><div class="rname">${sub?sub.name:'—'}</div><div class="rsub">${sub?sub.phone:''}</div></div>
        <div class="ramount">${money(b.amount)}</div>
      </div>`;
    });
  }
  return html;
}

function renderSubscribersTab(){
  let html = `<div class="section-title"><span>المشتركين (${state.subscribers.length})</span></div>`;
  if(!state.tiers.length){
    html += `<div class="empty-state">لازم تضيف فئة أمبير واحدة على الأقل من تبويب "الفئات" قبل ما تضيف مشتركين.</div>`;
  } else if(!state.subscribers.length){
    html += `<div class="empty-state">ما في مشتركين مسجّلين بعد. اضغط + لإضافة أول مشترك.</div>`;
  } else {
    state.subscribers.forEach(s=>{
      const t = tierById(s.tierId);
      html += `<div class="list-row" data-edit-subscriber="${s.id}" style="cursor:pointer;">
        <div><div class="rname">${s.name}</div><div class="rsub">${s.phone} · ${t?t.ampere+' أمبير':'—'}</div></div>
        <span style="color:var(--muted);">›</span>
      </div>`;
    });
  }
  if(state.tiers.length) html += `<div class="add-fab" id="add-subscriber-fab">+</div>`;
  return html;
}

function renderTiersTab(){
  let html = `
    <div class="field">
      <label>رمز العملة</label>
      <input type="text" id="currency-input" value="${state.config.currency}" style="max-width:100px;">
    </div>
    <div class="section-title"><span>فئات الأمبير والأسعار (${state.tiers.length})</span></div>`;
  if(!state.tiers.length){
    html += `<div class="empty-state">ما في فئات مضافة. اضغط + لإضافة أول فئة (مثلاً 5 أمبير).</div>`;
  } else {
    state.tiers.forEach(t=>{
      html += `<div class="tier-row" data-edit-tier="${t.id}" style="cursor:pointer;">
        <div><div class="tname">${t.ampere} أمبير</div><div class="tprice">${money(t.price)} / ك.و.س${t.fixed?' + '+money(t.fixed)+' رسم ثابت':''}</div></div>
        <span style="color:var(--muted);">›</span>
      </div>`;
    });
  }
  html += `<div class="add-fab" id="add-tier-fab">+</div>`;
  return html;
}

function renderReadingsTab(){
  let html = `
    <div class="month-picker">
      <label class="field" style="flex:1;margin:0;"><input type="month" id="month-input" value="${state.currentMonth}"></label>
    </div>`;
  if(!state.subscribers.length){
    html += `<div class="empty-state">ما في مشتركين مسجّلين بعد.</div>`;
    return html;
  }
  state.subscribers.forEach(s=>{
    const t = tierById(s.tierId);
    const bill = billFor(s.id, state.currentMonth);
    const prevR = previousReading(s.id, state.currentMonth);
    const oldVal = bill ? bill.oldReading : (prevR!==null ? prevR : '');
    const newVal = bill ? bill.newReading : '';
    const cons = bill ? bill.consumption : '';
    const amt = bill ? bill.amount : '';
    html += `
      <div class="reading-card">
        <div class="rc-head">
          <div><div class="rc-name">${s.name}</div><div class="rc-tier">${t?t.ampere+' أمبير · '+money(t.price)+'/ك.و.س':'—'}</div></div>
          ${bill?`<span class="pill ${bill.paid?'paid':'unpaid'}">${bill.paid?'مدفوع':'غير مدفوع'}</span>`:''}
        </div>
        <div class="rc-inputs">
          <div class="field"><label>القراءة القديمة</label><input type="number" id="old_${s.id}" value="${oldVal}" step="0.01"></div>
          <div class="field"><label>القراءة الجديدة</label><input type="number" id="new_${s.id}" value="${newVal}" step="0.01"></div>
        </div>
        <p class="error-text" id="err_${s.id}"></p>
        <div class="rc-summary"><span>الاستهلاك: <b>${cons!==''?cons+' ك.و.س':'—'}</b></span><span>المبلغ: <b>${amt!==''?money(amt):'—'}</b></span></div>
        <div class="rc-actions">
          <button class="btn-secondary" data-save-reading="${s.id}">${bill?'تحديث':'حفظ'}</button>
          ${bill?`<button class="btn-secondary" data-toggle-paid="${bill.id}" style="color:${bill.paid?'var(--danger)':'var(--success)'};">${bill.paid?'إلغاء الدفع':'تعليم كمدفوع'}</button>`:''}
        </div>
        ${bill?`<button class="print-btn" data-print-bill="${bill.id}" style="width:100%;margin-top:8px;">🖨 طباعة وصل</button>`:''}
      </div>`;
  });
  return html;
}

function renderSubscriberView(){
  const sub = subscriberById(state.currentSubscriberId);
  if(!sub) return `<div class="empty-state">تعذّر إيجاد الاشتراك</div>`;
  const t = tierById(sub.tierId);
  const history = state.bills.filter(b=>b.subscriberId===sub.id).sort((a,b)=>a.month<b.month?1:-1);
  const latest = history[0];
  let html = `
    <div class="profile-card">
      <div class="pname">${sub.name}</div>
      <div class="pmeta">${sub.phone} · ${t?t.ampere+' أمبير':'—'} · ${t?money(t.price)+'/ك.و.س':''}</div>
    </div>`;
  if(latest){
    html += `
      <div class="section-title">آخر فاتورة — ${fmtMonth(latest.month)}</div>
      <div class="stat-grid">
        <div class="stat-card"><div class="label">الاستهلاك</div><div class="val">${latest.consumption} ك.و.س</div></div>
        <div class="stat-card"><div class="label">المبلغ</div><div class="val">${money(latest.amount)}</div></div>
        <div class="stat-card wide"><div class="label">الحالة</div><div class="val"><span class="pill ${latest.paid?'paid':'unpaid'}">${latest.paid?'مدفوع':'غير مدفوع'}</span></div></div>
      </div>
      <button class="print-btn" data-print-bill="${latest.id}" style="width:100%;margin-bottom:20px;">🖨 طباعة وصل هالفاتورة</button>`;
  } else {
    html += `<div class="empty-state">ما في فواتير مسجّلة إلك لحد هلق</div>`;
  }
  html += `<div class="section-title"><span>سجلّ الفواتير</span></div>`;
  if(history.length<=1){
    html += `<div class="empty-state">ما في سجلّ سابق</div>`;
  } else {
    history.slice(1).forEach(b=>{
      html += `<div class="list-row">
        <div><div class="rname">${fmtMonth(b.month)}</div><div class="rsub">${b.consumption} ك.و.س</div></div>
        <div style="text-align:left;"><div class="ramount">${money(b.amount)}</div><span class="pill ${b.paid?'paid':'unpaid'}">${b.paid?'مدفوع':'غير مدفوع'}</span></div>
      </div>`;
    });
  }
  return html;
}

function renderBottomNav(){
  const tabs = [
    {id:'dashboard', label:'الرئيسية'},
    {id:'readings', label:'القراءات'},
    {id:'subscribers', label:'المشتركين'},
    {id:'tiers', label:'الفئات'}
  ];
  return `<div class="bottom-nav">${tabs.map(t=>`
    <button class="${state.adminTab===t.id?'active':''}" data-tab="${t.id}">
      <span class="dot"></span>${t.label}
    </button>`).join('')}</div>`;
}

function renderFormModal(){
  if(state.formType==='tier'){
    const d = state.formData;
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-sheet">
          <button class="close-x" id="close-modal">×</button>
          <h3>${d.id?'تعديل فئة':'إضافة فئة أمبير'}</h3>
          <form id="tier-form">
            <div class="field"><label>الأمبير</label><input name="ampere" value="${d.ampere||''}" placeholder="مثلاً 5" required></div>
            <div class="field"><label>سعر الكيلوواط ساعة</label><input name="price" type="number" step="0.01" value="${d.price||''}" required></div>
            <div class="field"><label>رسم ثابت شهري (اختياري)</label><input name="fixed" type="number" step="0.01" value="${d.fixed||0}"></div>
            <button class="btn-primary" type="submit">${d.id?'حفظ التعديل':'إضافة'}</button>
            ${d.id?`<button type="button" class="btn-danger-text" id="delete-tier-btn" style="width:100%;margin-top:10px;">حذف الفئة</button>`:''}
          </form>
        </div>
      </div>`;
  }
  if(state.formType==='subscriber'){
    const d = state.formData;
    return `
      <div class="modal-overlay" id="modal-overlay">
        <div class="modal-sheet">
          <button class="close-x" id="close-modal">×</button>
          <h3>${d.id?'تعديل مشترك':'إضافة مشترك جديد'}</h3>
          <form id="subscriber-form">
            <div class="field"><label>الاسم</label><input name="name" value="${d.name||''}" required></div>
            <div class="field"><label>رقم الهاتف</label><input name="phone" value="${d.phone||''}" required></div>
            <div class="field"><label>فئة الأمبير</label>
              <select name="tierId" required>
                <option value="">اختر فئة</option>
                ${state.tiers.map(t=>`<option value="${t.id}" ${d.tierId===t.id?'selected':''}>${t.ampere} أمبير — ${money(t.price)}/ك.و.س</option>`).join('')}
              </select>
            </div>
            <div class="field"><label>العنوان (اختياري)</label><input name="address" value="${d.address||''}"></div>
            <button class="btn-primary" type="submit">${d.id?'حفظ التعديل':'إضافة'}</button>
            ${d.id?`<button type="button" class="btn-danger-text" id="delete-subscriber-btn" style="width:100%;margin-top:10px;">حذف المشترك</button>`:''}
          </form>
        </div>
      </div>`;
  }
  return '';
}

function attachContentEvents(){
  const logoutBtn = document.getElementById('logout-btn');
  if(logoutBtn) logoutBtn.onclick = logout;

  const monthInput = document.getElementById('month-input');
  if(monthInput) monthInput.onchange = (e)=>{ state.currentMonth = e.target.value; render(); };

  const currencyInput = document.getElementById('currency-input');
  if(currencyInput) currencyInput.onchange = async (e)=>{ state.config.currency = e.target.value || '$'; await saveConfig(); render(); };

  document.querySelectorAll('[data-tab]').forEach(el=>{
    el.onclick = ()=>{ state.adminTab = el.getAttribute('data-tab'); render(); };
  });

  document.querySelectorAll('[data-save-reading]').forEach(el=>{
    el.onclick = ()=> saveReadingRow(el.getAttribute('data-save-reading'));
  });
  document.querySelectorAll('[data-toggle-paid]').forEach(el=>{
    el.onclick = ()=> togglePaid(el.getAttribute('data-toggle-paid'));
  });
  document.querySelectorAll('[data-print-bill]').forEach(el=>{
    el.onclick = ()=> printReceipt(el.getAttribute('data-print-bill'));
  });

  const addTierFab = document.getElementById('add-tier-fab');
  if(addTierFab) addTierFab.onclick = ()=> openForm('tier', {});
  document.querySelectorAll('[data-edit-tier]').forEach(el=>{
    el.onclick = ()=> openForm('tier', {...tierById(el.getAttribute('data-edit-tier'))});
  });

  const addSubFab = document.getElementById('add-subscriber-fab');
  if(addSubFab) addSubFab.onclick = ()=> openForm('subscriber', {});
  document.querySelectorAll('[data-edit-subscriber]').forEach(el=>{
    el.onclick = ()=> openForm('subscriber', {...subscriberById(el.getAttribute('data-edit-subscriber'))});
  });

  const overlay = document.getElementById('modal-overlay');
  if(overlay) overlay.onclick = (e)=>{ if(e.target.id==='modal-overlay') closeForm(); };
  const closeModal = document.getElementById('close-modal');
  if(closeModal) closeModal.onclick = closeForm;

  const tierForm = document.getElementById('tier-form');
  if(tierForm) tierForm.onsubmit = submitTierForm;
  const deleteTierBtn = document.getElementById('delete-tier-btn');
  if(deleteTierBtn) deleteTierBtn.onclick = ()=>{ deleteTier(state.formData.id); closeForm(); };

  const subForm = document.getElementById('subscriber-form');
  if(subForm) subForm.onsubmit = submitSubscriberForm;
  const deleteSubBtn = document.getElementById('delete-subscriber-btn');
  if(deleteSubBtn) deleteSubBtn.onclick = ()=>{ deleteSubscriber(state.formData.id); closeForm(); };
}

loadAll();
</script>
</body>
</html>
